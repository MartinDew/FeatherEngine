name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so CI and local formatting agree; bump together with your local clang-format.
      - name: Install clang-format
        run: pip install clang-format==23.1.3

      - name: Validate formatting
        run: python tools/format/validate_format.py

  build:
    name: ${{ matrix.config.name }} / ${{ matrix.mode }}
    runs-on: ${{ matrix.config.os }}
    # Empty for Windows, which runs on the host.
    container: ${{ matrix.config.container }}

    strategy:
      fail-fast: false
      matrix:
        mode: [ debug, releasedbg, release ]
        config:
          # Disabled for now due to a lack of resources to test on MacOS. If you want to test on MacOS, uncomment the following lines and add a MacOS runner.
          # ── macOS (Apple Clang) ──────────────────────────────────────────
          # - name: macOS
          #   os: macos-latest
          #   toolchain_flag: ""
          

          # ── Linux (GCC) ──────────────────────────────────────────────────
          # Ubuntu only packages pre-release GCC 16 snapshots, which ICE on class_db.cpp at -O2+.
          - name: Linux
            os: ubuntu-24.04
            container: "gcc:16.2"
            toolchain_flag: "--toolchain=gcc"

          # ── Windows (clang-cl) ───────────────────────────────────────────
          - name: Windows LLVM
            os: windows-latest
            toolchain_flag: "--toolchain=clang-cl"

    env:
      # The Linux container runs as root, which xmake refuses without this.
      XMAKE_ROOT: y

    steps:
      # ── Linux system dependencies (Debian trixie container, runs as root) ──
      # setup-vulkan-sdk calls sudo and jq.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            git make cmake ninja-build pkg-config python3 jq sudo xz-utils unzip \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libaudio-dev libjack-jackd2-dev libsndio-dev \
            libpipewire-0.3-dev libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
            libfribidi-dev liburing-dev

      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── Python (required by codegen scripts; stdlib only, no pip install) ──
      # Linux uses the container's python3.
      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Install xmake ─────────────────────────────────────────────────────
      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1

      # ── CMake/Ninja ───────────────────────────────────────────────────────
      - name: Setup cmake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      # ── Vulkan SDK ────────────────────────────────────────────────────────
      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-use-cache: true
          vulkan-query-version: latest

      # ── LLVM (Windows) ────────────────────────────────────────────────────
      # install-llvm-action stops at 21, and clang-cl 20/21 crash on the FType specializations.
      - name: Install LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          $version = "23.1.4"
          $dest = "C:\Program Files\LLVM"
          Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/clang+llvm-$version-x86_64-pc-windows-msvc.tar.xz" -OutFile llvm.tar.xz
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Path $dest | Out-Null
          C:\Windows\System32\tar.exe -xf llvm.tar.xz -C $dest --strip-components=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item llvm.tar.xz
          & "$dest\bin\clang-cl.exe" --version

      # ── Windows toolchain ─────────────────────────────────────────────────
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: k3DW/setup-msvc@v1
        with:
          vs-version: 17.14

      - name: Setup LLVM In Path
        if: runner.os == 'Windows'
        run: echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: Remove Strawberry Perl from PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch 'Strawberry' }) -join ';'
          echo "PATH=$env:PATH" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Set UTF-8 Code Page (Windows)
        if: runner.os == 'Windows'
        run: chcp 65001

      # ── Configure ─────────────────────────────────────────────────────────
      - name: Configure
        run: xmake f -m ${{ matrix.mode }} ${{ matrix.config.toolchain_flag }} -y

      # ── Dump failed package install logs (helps diagnose cmake build errors) ─
      - name: Dump failed package logs
        if: failure() && runner.os == 'Linux'
        run: |
          find ~/.xmake/cache/packages -name "install.txt" -path "*/installdir.failed/*" 2>/dev/null | while read f; do
            echo "========== $f =========="
            tail -300 "$f"
          done

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build
        run: xmake build -y

      # ── Upload artifacts ───────────────────────────────────────────────────
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: feather-${{ matrix.config.name }}-${{ matrix.mode }}
          path: build/bin/*
          if-no-files-found: warn
          retention-days: 7
